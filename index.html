<title>SSEI · Preparación AENA</title>
<style>
:root{
  --bg:#10151C; --panel:#182029; --panel2:#1E2833; --line:#2B3743;
  --hi:#F2B705; --go:#5BC98C; --stop:#E8503A; --txt:#E6EDF3; --dim:#7D8B99;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--sans);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-size:25px;line-height:1.1;letter-spacing:-.02em;margin:6px 0 2px;font-weight:800}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.sub{color:var(--dim);font-size:13px;margin:0;line-height:1.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
button,a.btn{font-family:inherit;font-size:16px;border-radius:12px;padding:13px 15px;background:var(--panel2);color:var(--txt);font-weight:650;cursor:pointer;border:1px solid var(--line);text-decoration:none;display:inline-block;text-align:center}
button:active,a.btn:active{transform:scale(.985)}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button[disabled]{opacity:.4}
.primary{background:var(--hi);color:#10151C;border-color:var(--hi)}
.ghost{background:transparent}
.danger{background:transparent;color:var(--stop);border-color:#4A2A25}
.full{width:100%}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.days button{flex:0 0 auto;padding:9px 11px;border-radius:10px;background:var(--panel);min-width:56px}
.days button .dw{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;display:block}
.days button .dn{font-size:17px;font-weight:800;display:block;margin-top:2px}
.days button.sel{background:var(--hi);border-color:var(--hi)}
.days button.sel .dw,.days button.sel .dn{color:#10151C}
.days button.hoy{border-color:var(--hi)}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px}
.sess .t{font-size:16px;font-weight:750;line-height:1.25}
.sess .m{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
.sess.done{border-color:#2C4A3A}
.sess.done .t::after{content:" ✓";color:var(--go)}
.sess .acts{display:flex;gap:7px;margin-top:11px}
.sess .acts button{flex:1;padding:11px;font-size:14px}
.runway{display:flex;gap:3px;margin:12px 0 16px}
.runway i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.runway i.on{background:var(--hi)}
.runway i.cur{background:var(--txt)}
.blockh{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hi)}
.blocktitle{font-size:27px;line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:8px 0 8px}
.blockdet{font-size:16px;line-height:1.45;margin:0 0 10px}
.cues{list-style:none;padding:0;margin:10px 0 0;border-top:1px solid var(--line)}
.cues li{font-size:14px;color:var(--dim);padding:9px 0 0;line-height:1.35}
.cues li::before{content:"— ";color:var(--hi)}
.fig{display:block;width:100%;max-width:330px;margin:2px auto 8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.fig text{font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.06em}
.vid{width:100%;margin:2px 0 4px;font-size:14px;padding:11px}
.clock{font-family:var(--mono);font-size:72px;font-weight:700;letter-spacing:-.04em;text-align:center;margin:16px 0 6px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--hi)}
.clock.over{color:var(--stop)}
.stage{min-height:42vh;display:flex;flex-direction:column;justify-content:center}
.bar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(16,21,28,0),var(--bg) 32%);padding:14px 0 6px;display:flex;gap:8px}
.bar button{flex:1}
.bar button.narrow{flex:0 0 58px}
input[type=number],input[type=text]{width:100%;font-family:var(--mono);font-size:32px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px;text-align:center}
input:focus{outline:2px solid var(--hi)}
.mic{width:100%;margin-top:10px}
.mic.live{background:var(--stop);color:#fff;border-color:var(--stop)}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{flex:0 1 auto;padding:12px 15px;font-size:15px}
.chips button.sel{background:var(--hi);color:#10151C;border-color:var(--hi)}
textarea{width:100%;height:200px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:var(--mono);font-size:12px;padding:12px;line-height:1.5}
.tabs{display:flex;gap:5px;margin:12px 0}
.tabs button{flex:1;padding:10px 4px;font-size:13px}
.tabs button.sel{background:var(--txt);color:#10151C;border-color:var(--txt)}
.hide{display:none!important}
.mini{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;line-height:1.35}
.field input{font-size:22px;padding:11px}
.field .row input{flex:1}
.field .row button{flex:0 0 54px;padding:11px}
.pday{border-top:1px solid var(--line);padding:14px 0 4px}
.pday:first-child{border:none}
.pday h3{font-size:15px;margin:0 0 2px;font-weight:750}
.pday .m{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}

.pex:last-child{border:none}
.pex .n{font-family:var(--mono);font-size:11px;color:var(--hi);flex:0 0 22px;padding-top:2px}
.pex b{font-weight:700}
.pex span{color:var(--dim);display:block;font-size:13px}
.pex a{color:var(--hi);font-size:12px;text-decoration:none}
.toggle{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px}
.toggle.on{color:var(--go);border-color:#2C4A3A}
.toggle.off{color:var(--dim)}
@media(prefers-reduced-motion:no-preference){.stage{animation:in .2s ease}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<body>
<div class="wrap" id="app"></div>

<script>
/* ========== ALMACENAMIENTO ========== */
const mem={d:{}};
const DB={
  read(){ try{ return JSON.parse(localStorage.getItem('ssei')||'{}'); }catch(e){ return mem.d; } },
  write(d){ try{ localStorage.setItem('ssei',JSON.stringify(d)); }catch(e){ mem.d=d; } },
  get(k,def){ const d=this.read(); return k in d?d[k]:def; },
  set(k,v){ const d=this.read(); d[k]=v; this.write(d); }
};
const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['dom','lun','mar','mié','jue','vie','sáb'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dobj(i){const[y,m,d]=i.split('-').map(Number);return new Date(y,m-1,d);}
const esDate=i=>{const dt=dobj(i);return DIAS[dt.getDay()]+' '+dt.getDate()+' '+MES[dt.getMonth()];};

/* ========== VOZ Y SONIDO ========== */
let voice=null,ttsOn=DB.get('tts',true),audioCtx=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>v.lang==='es-ES'&&/Mónica|Monica|Marisol/i.test(v.name))||vs.find(v=>v.lang==='es-ES')||vs.find(v=>v.lang.startsWith('es'))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!ttsOn||!('speechSynthesis' in window)||!t)return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/·/g,'.').replace(/×/g,' por '));
    if(voice)u.voice=voice;u.lang='es-ES';u.rate=1;speechSynthesis.speak(u);}catch(e){}
}
function prime(){
  try{ if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();g.gain.value=0.0001;
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.02);}catch(e){}
  if('speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
}
function beep(n=3){
  if(!audioCtx)return;
  for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='square';o.frequency.value=i===n-1?1180:880;const t0=audioCtx.currentTime+i*0.28;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.34,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
    o.connect(g);g.connect(audioCtx.destination);o.start(t0);o.stop(t0+0.24);}
}
const NUM={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,dieciséis:16,diecisiete:17,dieciocho:18,diecinueve:19,
veinte:20,veintiuno:21,veintiun:21,veintiún:21,veintidos:22,veintidós:22,veintitres:23,veintitrés:23,veinticuatro:24,
veinticinco:25,veintiseis:26,veintiséis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,
cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
function parseNum(s){
  if(!s)return null; s=s.toLowerCase().replace(/,/g,'.');
  const d=s.match(/-?\d+(\.\d+)?/); if(d)return parseFloat(d[0]);
  let t=null;
  for(const w of s.split(/[\s,]+/)){const c=w.replace(/[^a-záéíóúñ]/g,'');if(c==='y')continue;if(c in NUM)t=(t===null?0:t)+NUM[c];}
  return t;
}
let rec=null,recActive=false;
function listen(cb,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Este navegador no reconoce voz. Escribe el dato, o abre la app en Safari.');return;}
  if(recActive){try{rec.stop();}catch(e){}return;}
  try{speechSynthesis.cancel();}catch(e){}
  rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=3;
  recActive=true; if(btn){btn.classList.add('live');btn.textContent='● Escuchando… toca para parar';}
  rec.onresult=e=>cb(e.results[0][0].transcript);
  rec.onerror=e=>{if(e.error==='not-allowed')alert('Falta permiso de micrófono.\nAjustes → Safari → Micrófono → Permitir.');};
  rec.onend=()=>{recActive=false;if(btn){btn.classList.remove('live');btn.textContent='🎤 Responder hablando';}};
  try{rec.start();}catch(e){recActive=false;}
}
let wl=null,wakeWanted=DB.get('wake',true),wakeState='off';
async function wakeOn(){
  if(!wakeWanted){wakeState='off';return;}
  if(!('wakeLock' in navigator)){wakeState='na';return;}
  try{wl=await navigator.wakeLock.request('screen');wakeState='on';wl.onrelease=()=>{wakeState='off';};}catch(e){wakeState='na';}
}
function wakeOff(){try{if(wl){wl.release();wl=null;}}catch(e){}wakeState='off';}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.view==='play')wakeOn();});

 lbl:(x,y,t,col='#7D8B99',anc='middle')=>`<text x="${x}" y="${y}" fill="${col}" text-anchor="${anc}">${t}</text>`,
 arrow:(x,y1,y2)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#F2B705" stroke-width="2"/><polygon points="${x-3.5},${y2+5} ${x+3.5},${y2+5} ${x},${y2}" fill="#F2B705"/>`
};

/* Media: vídeo + figura por ejercicio */
const MEDIA={
 'Dominadas escapulares':{yt:'scapular pull ups dominadas escapulares',fig:'scap'},
 'Isométrico':{yt:'dead hang pull up isometric hold ángulo muerto'},
 'Negativa':{yt:'dominada negativa excéntrica técnica'},
 'Jalón con pausa':{yt:'jalón al pecho técnica escápula',fig:'jalon'},

function renderHome(){
  const d=state.day,list=SCHEDULE[d]||[],daily=DB.get('daily|'+d,{});
  const strip=DAYS.map(x=>{const dt=dobj(x);
    return `<button data-day="${x}" class="${x===state.day?'sel':''} ${x===today()?'hoy':''}">
      <span class="dw">${DIAS3[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span></button>`;}).join('');

  const sess=list.map((key,slot)=>{
    const s=CAL[key]; if(!s)return'';
    const done=DB.get(doneKey(d,slot),false),pos=DB.get(posKey(d,slot),0);
    const hasAsk=s.blocks.some(b=>b.t==='ask');
    return `<div class="sess ${done?'done':''}">
      <div class="t">${H(s.name)}</div><div class="m">${H(s.tag)} · ${s.blocks.length} bloques</div>
      <div class="acts">
        <button class="primary" data-go="${slot}">${pos>0&&!done?'Reanudar':'Empezar'}</button>
        ${pos>0&&!done?`<button data-restart="${slot}">Desde el inicio</button>`:''}
        ${hasAsk?`<button data-edit="${slot}">Datos</button>`:''}
      </div></div>`;}).join('')||`<div class="card"><p class="sub">Sin sesión programada este día.</p></div>`;

  const wtxt=wakeState==='na'?'No disponible':(wakeWanted?'Activada':'Desactivada');

  app.innerHTML=`
   <div class="eyebrow">Bomberos AENA · IC10 · semana 1</div>
   <h1>${esDate(d)}${d===today()?' · hoy':''}</h1>
   <p class="sub">Objetivo de la semana: preparar tejido, no ganar forma.</p>
   <div class="days">${strip}</div>
   <div class="tabs">
     <button data-tab="hoy" class="${state.tab==='hoy'?'sel':''}">Sesiones</button>
     <button data-tab="plan" class="${state.tab==='plan'?'sel':''}">Plan</button>

   <div class="${state.tab==='hoy'?'':'hide'}">
     ${sess}
     <div class="card">
       <div class="row between" style="margin-bottom:10px">
         <span class="mini">Voz del entrenador</span>
         <button class="toggle ${ttsOn?'on':'off'}" id="tts">${ttsOn?'Activada':'Desactivada'}</button></div>
       <div class="row between">
         <span class="mini">Pantalla encendida</span>
         <button class="toggle ${wakeWanted&&wakeState!=='na'?'on':'off'}" id="wake">${wtxt}</button></div>
       <p class="hint">El sonido de iOS se desbloquea al pulsar “Empezar”. Hasta entonces la app está muda: es normal.</p>
     </div>
   </div>
   <div class="${state.tab==='plan'?'':'hide'}"><div class="card">${planHTML(d)}</div></div>
   <div class="${state.tab==='diario'?'':'hide'}">
     <div class="card"><h2>${esDate(d)}</h2>
       <div class="field"><label>Pulsaciones al despertar, tumbado, 60 s</label>
         <div class="row"><input type="number" inputmode="numeric" id="fc" value="${H(daily.fc||'')}" placeholder="85"><button data-mic="fc">🎤</button></div></div>
       <div class="field"><label>Sueño del 1 al 10</label>
         <div class="row"><input type="number" inputmode="numeric" id="sueno" value="${H(daily.sueno||'')}" placeholder="7"><button data-mic="sueno">🎤</button></div></div>
       <div class="field"><label>Peso en ayunas (sábados)</label>
         <div class="row"><input type="number" inputmode="decimal" step="0.1" id="peso" value="${H(daily.peso||'')}" placeholder="95.0"><button data-mic="peso">🎤</button></div></div>
       <button class="primary full" id="saveDaily">Guardar</button>
       <p class="hint">Hoy 85 ppm. Objetivo 65-70 en ocho semanas.<br>Si un día estás 8-10 ppm por encima de tu media, baja la intensidad.</p>
     </div>
   </div>
   <div class="${state.tab==='registro'?'':'hide'}">
     <div class="card"><h2>Resumen para Claude</h2>
       <textarea id="sum" readonly>${H(buildSummary())}</textarea>
       <div class="row" style="margin-top:10px">
         <button class="primary" style="flex:1" id="copy">Copiar</button>
         <button class="danger" id="reset">Borrar todo</button></div>
       <p class="hint">Pégamelo en el chat el domingo y te monto la semana 2.</p>
     </div>
   </div>`;

  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;render();});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    prime();state.slot=+b.dataset.go;state.sess=SCHEDULE[state.day][state.slot];
    state.i=DB.get(posKey(state.day,state.slot),0);state.view='play';wakeOn();render();});
  app.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>{
    prime();state.slot=+b.dataset.restart;state.sess=SCHEDULE[state.day][state.slot];
    state.i=0;DB.set(posKey(state.day,state.slot),0);state.view='play';wakeOn();render();});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    state.slot=+b.dataset.edit;state.sess=SCHEDULE[state.day][state.slot];state.view='edit';render();});
  const t=app.querySelector('#tts');if(t)t.onclick=()=>{ttsOn=!ttsOn;DB.set('tts',ttsOn);render();};
  const w=app.querySelector('#wake');if(w)w.onclick=async()=>{
    wakeWanted=!wakeWanted;DB.set('wake',wakeWanted);if(wakeWanted){await wakeOn();wakeOff();}render();};
  const sd=app.querySelector('#saveDaily');
  if(sd)sd.onclick=()=>{DB.set('daily|'+d,{fc:app.querySelector('#fc').value,sueno:app.querySelector('#sueno').value,peso:app.querySelector('#peso').value});
    sd.textContent='Guardado ✓';setTimeout(()=>sd.textContent='Guardar',1400);};
  app.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>{prime();
    const inp=app.querySelector('#'+b.dataset.mic);listen(txt=>{const v=parseNum(txt);if(v!==null)inp.value=v;},null);});
  const cp=app.querySelector('#copy');
  if(cp)cp.onclick=async()=>{const a=app.querySelector('#sum');
    try{await navigator.clipboard.writeText(a.value);}catch(e){a.removeAttribute('readonly');a.select();document.execCommand('copy');a.setAttribute('readonly','');}
    cp.textContent='Copiado ✓';setTimeout(()=>cp.textContent='Copiar',1600);};
  const rs=app.querySelector('#reset');
  if(rs)rs.onclick=()=>{if(confirm('¿Borrar todos los registros? No se puede deshacer.')){DB.write({});ttsOn=true;wakeWanted=true;render();}};
}

function planHTML(day){
  return DAYS.map(d=>{
    const items=(SCHEDULE[d]||[]).map(k=>{const s=CAL[k];
      const ex=s.blocks.filter(b=>b.t==='ex'||b.t==='info');
      return `<div style="margin-top:10px"><div class="m">${H(s.tag)}</div>
        <div style="font-weight:700;font-size:14px;margin:2px 0 6px">${H(s.name)}</div>
        ${ex.map((b,n)=>{const m=media(b.h);
          return `<div class="pex"><span class="n">${String(n+1).padStart(2,'0')}</span>
          <div><b>${H(b.h)}</b>${b.d?`<span>${H(b.d)}</span>`:''}
          ${m?`<a href="${ytUrl(m.yt)}" target="_blank" rel="noopener">▶ vídeo</a>`:''}</div></div>`;}).join('')}</div>`;}).join('');
    return `<div class="pday" ${d===day?'style="background:rgba(242,183,5,.04);margin:0 -14px;padding:14px"':''}>
      <h3>${esDate(d)}</h3>${items}</div>`;}).join('');
}

function renderEdit(){
  const d=state.day,s=CAL[state.sess],asks=s.blocks.filter(b=>b.t==='ask');
  app.innerHTML=`
   <div class="row between"><span class="mini">${H(esDate(d))}</span>
     <button class="ghost" id="back" style="padding:8px 12px;font-size:13px">Volver</button></div>
   <h1 style="font-size:21px">${H(s.name)}</h1>
   <p class="sub">Corrige cualquier dato. Se guarda al pulsar abajo.</p>
   <div class="card">
     ${asks.map(b=>{const v=DB.get(ansKey(d,state.slot,b.id),'');
       if(b.kind==='choice')return `<div class="field"><label>${H(b.h)}</label>
         <div class="chips" data-chip="${H(b.id)}">${b.options.map(o=>`<button data-v="${H(o)}" class="${v===o?'sel':''}">${H(o)}</button>`).join('')}</div></div>`;
       return `<div class="field"><label>${H(b.h)}${b.unit?' ('+H(b.unit)+')':''}</label>
         <div class="row"><input ${b.kind==='num'?'type="number" inputmode="decimal"':'type="text"'} data-id="${H(b.id)}" value="${H(v)}"><button data-emic="${H(b.id)}">🎤</button></div></div>`;
     }).join('')}
   </div>
   <button class="primary full" id="save">Guardar cambios</button>
   <button class="ghost full" id="undone" style="margin-top:8px">Marcar sesión como no hecha</button>`;
  app.querySelector('#back').onclick=()=>{state.view='home';render();};
  app.querySelectorAll('[data-chip]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    DB.set(ansKey(d,state.slot,g.dataset.chip),b.dataset.v);
    g.querySelectorAll('button').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');}));
  app.querySelectorAll('[data-emic]').forEach(b=>b.onclick=()=>{prime();
    const inp=app.querySelector(`[data-id="${b.dataset.emic}"]`);
    listen(txt=>{const v=parseNum(txt);inp.value=(inp.type==='number'&&v!==null)?v:txt;},null);});
  app.querySelector('#save').onclick=e=>{
    app.querySelectorAll('[data-id]').forEach(inp=>DB.set(ansKey(d,state.slot,inp.dataset.id),inp.value));
    e.target.textContent='Guardado ✓';setTimeout(()=>{state.view='home';render();},900);};
  app.querySelector('#undone').onclick=()=>{DB.set(doneKey(d,state.slot),false);DB.set(posKey(d,state.slot),0);state.view='home';render();};
}

let timerId=null;
function renderPlay(){
  clearInterval(timerId);timerId=null;
  const d=state.day,s=CAL[state.sess],n=s.blocks.length;
  if(state.i>=n)state.i=n-1;
  const b=s.blocks[state.i];
  DB.set(posKey(d,state.slot),state.i);
  const seg=Array.from({length:n},(_,k)=>`<i class="${k<state.i?'on':k===state.i?'cur':''}"></i>`).join('');

  let body='',spoken='';
  if(b.t==='timer'){
    body=`<div class="blockh">${H(b.h)}</div><div class="clock" id="clock">${fmt(b.sec)}</div>
      <div class="row"><button style="flex:1" id="start">Empezar</button><button style="flex:1" class="ghost" id="skip">Saltar</button></div>`;
    spoken=b.h;
  } else if(b.t==='ask'){
    const prev=DB.get(ansKey(d,state.slot,b.id),'');
    body=`<div class="blockh">Registro</div><div class="blocktitle">${H(b.h)}</div>`;
    if(b.kind==='choice'){
      body+=`<div class="chips" id="chips">${b.options.map(o=>`<button data-v="${H(o)}" class="${prev===o?'sel':''}">${H(o)}</button>`).join('')}</div>`;
    } else {
      body+=`<input ${b.kind==='num'?'type="number" inputmode="decimal"':'type="text"'} id="ans" value="${H(prev)}" placeholder="${H(b.unit||'')}">
        <button class="mic" id="mic">🎤 Responder hablando</button>
        <p class="hint">Di solo el dato: “veintiocho”. Frases cortas.</p>`;
    }
    spoken=b.h;
  } else {
    const m=media(b.h);
    body=`<div class="blockh">${b.t==='ex'?'Ejercicio':'Aviso'} · ${state.i+1} de ${n}</div>
      <div class="blocktitle">${H(b.h)}</div>
      ${b.d?`<p class="blockdet">${H(b.d)}</p>`:''}
      ${m&&m.fig?FIG[m.fig]:''}
      ${m?`<a class="btn vid" href="${ytUrl(m.yt)}" target="_blank" rel="noopener">▶ Ver vídeo del ejercicio</a>`:''}
      ${b.cues?`<ul class="cues">${b.cues.map(c=>`<li>${H(c)}</li>`).join('')}</ul>`:''}`;
    spoken=b.h+(b.d?'. '+b.d:'');
  }

  app.innerHTML=`
   <div class="row between"><span class="mini">${H(s.name)}</span>
     <button class="ghost" id="exit" style="padding:8px 12px;font-size:13px">Salir</button></div>
   <div class="runway">${seg}</div>
   <div class="stage">${body}</div>
   <div class="bar">
     <button class="ghost narrow" id="prev" ${state.i===0?'disabled':''}>‹</button>
     <button class="ghost narrow" id="repeat">🔊</button>
     <button class="primary" id="next">${state.i===n-1?'Terminar':'Siguiente'}</button>
   </div>`;

  say(spoken);
  app.querySelector('#exit').onclick=()=>{wakeOff();state.view='home';render();};
  app.querySelector('#repeat').onclick=()=>{prime();say(spoken);};
  app.querySelector('#prev').onclick=()=>{if(state.i>0){state.i--;render();}};
  app.querySelector('#next').onclick=()=>{
    if(b.t==='ask'&&b.kind!=='choice'){const v=app.querySelector('#ans').value;DB.set(ansKey(d,state.slot,b.id),v);}
    if(state.i===n-1){DB.set(doneKey(d,state.slot),true);wakeOff();say('Sesión completada. Buen trabajo.');
      state.view='home';state.tab='hoy';render();}
    else{state.i++;render();}};

  if(b.t==='timer'){
    const clock=app.querySelector('#clock');let left=b.sec,run=false;
    app.querySelector('#skip').onclick=()=>{state.i++;render();};
    app.querySelector('#start').onclick=e=>{
      prime();
      if(run){clearInterval(timerId);run=false;e.target.textContent='Seguir';return;}
      run=true;e.target.textContent='Pausa';
      timerId=setInterval(()=>{
        left--;clock.textContent=fmt(left);clock.className='clock'+(left<=10?' warn':'');
        if(left===10)say('Diez segundos');
        if(left<=0){clearInterval(timerId);clock.className='clock over';beep(3);say('Vamos');
          setTimeout(()=>{if(state.view==='play'){state.i++;render();}},1500);}
      },1000);};
  }
  if(b.t==='ask'){
    if(b.kind==='choice'){
      app.querySelectorAll('#chips button').forEach(x=>x.onclick=()=>{
        DB.set(ansKey(d,state.slot,b.id),x.dataset.v);
        app.querySelectorAll('#chips button').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');
        setTimeout(()=>{if(state.i<CAL[state.sess].blocks.length-1){state.i++;render();}},260);});
    } else {
      const mic=app.querySelector('#mic'),inp=app.querySelector('#ans');
      mic.onclick=()=>{prime();listen(txt=>{if(b.kind==='num'){const v=parseNum(txt);if(v!==null)inp.value=v;}else inp.value=txt;},mic);};
    }
  }
}
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

function buildSummary(){
  const db=DB.read(),out=['RESUMEN · Adrián · Bomberos AENA · semana 1',''];
  DAYS.forEach(d=>{
    const daily=db['daily|'+d],lines=[];
    if(daily&&(daily.fc||daily.sueno||daily.peso))
      lines.push(`  diario: FC ${daily.fc||'-'} · sueño ${daily.sueno||'-'} · peso ${daily.peso||'-'}`);
    (SCHEDULE[d]||[]).forEach((key,slot)=>{
      const done=db[doneKey(d,slot)];
      const ans=Object.keys(db).filter(k=>k.startsWith('a|'+d+'|'+slot+'|')&&db[k]!=='');
      if(!done&&!ans.length)return;
      lines.push(`  ${CAL[key].name}: ${done?'COMPLETADA':'incompleta'}`);
      ans.forEach(k=>lines.push(`    ${k.split('|')[3]} = ${db[k]}`));
    });
    if(lines.length){out.push(esDate(d).toUpperCase());out.push(...lines);out.push('');}
  });
  if(out.length<=2)out.push('(sin datos todavía)');
  return out.join('\n');
}

wakeOn().then(()=>{});render();
</script>
</body>
